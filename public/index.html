<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyounime CDN</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e6eaf2; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .box { background: #181c24; border: 1px solid #2a3140; border-radius: 16px; padding: 24px 28px; max-width: 460px; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 6px 0; color: #9aa6be; font-size: 14px; line-height: 1.5; }
    code { background: #101319; padding: 2px 6px; border-radius: 6px; color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Kyounime Static CDN Ready</h1>
    <p>Endpoint JSON aktif:</p>
    <p><code>/api/config.json</code> &bull; <code>/api/home.json</code> &bull; <code>/api/catalog.json</code></p>
    <p><code>/api/details_bundle.json</code> &bull; <code>/api/genres/{slug}.json</code> &bull; <code>/covers/{slug}.webp</code></p>
  </div>
</body>
</html>
