name: Sync Kyounime Catalog & WebP Covers

on:
  schedule:
    # Jalankan otomatis setiap 4 jam (gratis di public repo GitHub Actions)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      refresh_covers:
        description: 'Paksa download ulang semua cover WebP (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Run catalog & WebP cover sync
        env:
          REFRESH_COVERS: ${{ github.event.inputs.refresh_covers || 'false' }}
        run: npm run sync

      - name: Commit & push updated CDN assets
        run: |
          git config user.name "kyounime-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/
          if git diff --staged --quiet; then
            echo "No catalog changes detected."
          else
            git commit -m "chore(sync): update anime catalog, details & WebP covers [skip ci]"
            git push
          fi
